<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree_Top_Miyagi TCG • Series 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1133 100%);
            color: white;
            font-family: 'VT323', monospace;
        }
        
        .card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .card:hover {
            transform: scale(1.05) rotate(2deg);
            box-shadow: 0 0 30px rgba(255, 235, 59, 0.6);
        }
        
        .pack {
            animation: packFloat 2s infinite ease-in-out;
        }
        
        @keyframes packFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body class="min-h-screen pb-12">
    <header class="bg-black/70 border-b-4 border-yellow-400 py-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-yellow-400 rounded-2xl flex items-center justify-center text-4xl">🐝</div>
                <div>
                    <h1 class="text-4xl font-bold tracking-widest text-yellow-300">TREE_TOP_MIYAGI</h1>
                    <p class="text-xs text-yellow-400 tracking-[4px]">SERIES 1 • 100 CARDS</p>
                </div>
            </div>
            
            <nav class="flex gap-8 text-xl">
                <a onclick="navigate(0)" class="cursor-pointer hover:text-yellow-400 transition-colors">HOME</a>
                <a onclick="navigate(1)" class="cursor-pointer hover:text-yellow-400 transition-colors">COLLECTION</a>
                <a onclick="navigate(2)" class="cursor-pointer hover:text-yellow-400 transition-colors">OPEN PACK</a>
                <a onclick="navigate(3)" class="cursor-pointer hover:text-yellow-400 transition-colors">ALL CARDS</a>
            </nav>
            
            <div class="flex items-center gap-3">
                <div id="timerDisplay" class="bg-black/80 px-4 py-2 rounded-2xl border-2 border-yellow-400 text-yellow-300 text-xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-clock"></i>
                    <span id="timeLeft">10:00</span>
                </div>
                <button onclick="claimDailyPack()" 
                        class="bg-yellow-400 hover:bg-yellow-300 text-black font-bold px-6 py-3 rounded-3xl text-xl flex items-center gap-3 transition-all">
                    <i class="fa-solid fa-bee"></i> OPEN PACK
                </button>
            </div>
        </div>
    </header>

    <div id="pageContainer" class="max-w-6xl mx-auto px-6 pt-8">
        
        <!-- HOME -->
        <div id="page-0" class="page">
            <div class="text-center py-16">
                <h1 class="text-8xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-pink-300 to-cyan-300 tracking-widest mb-4">
                    THE ULTIMATE TRIP
                </h1>
                <p class="text-4xl text-yellow-200 mb-12">Series 1 • 100 Cards • Powered by Grass Roots</p>
                
                <button onclick="navigate(2)" 
                        class="mt-10 bg-gradient-to-r from-yellow-400 to-pink-500 text-black text-3xl px-12 py-6 rounded-3xl font-bold flex items-center gap-4 mx-auto">
                    START YOUR JOURNEY <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- COLLECTION -->
        <div id="page-1" class="page hidden">
            <h2 class="text-5xl mb-8 flex items-center gap-4"><i class="fa-solid fa-layer-group text-yellow-400"></i> YOUR COLLECTION</h2>
            <div id="collectionGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
        </div>

        <!-- PACK OPENER -->
        <div id="page-2" class="page hidden">
            <div class="max-w-2xl mx-auto text-center py-12">
                <h2 class="text-6xl mb-6">OPEN A PACK</h2>
                <p class="text-3xl text-yellow-300 mb-12">5 cards • Every 10 minutes</p>
                
                <div id="packArea" onclick="if(!isOnCooldown) openPack()" 
                     class="cursor-pointer pack mx-auto w-96 h-96 border-8 border-yellow-400 bg-gradient-to-br from-purple-600 to-pink-600 rounded-3xl flex items-center justify-center text-9xl shadow-2xl">
                    <div class="text-center">
                        <i class="fa-solid fa-gift text-white text-8xl mb-6"></i>
                        <div class="text-white text-4xl font-bold tracking-widest">CLICK TO OPEN</div>
                    </div>
                </div>

                <div id="openedPack" class="hidden mt-12 grid grid-cols-5 gap-4"></div>
            </div>
        </div>

        <!-- ALL CARDS -->
        <div id="page-3" class="page hidden">
            <h2 class="text-5xl mb-8 flex items-center gap-4"><i class="fa-solid fa-images text-yellow-400"></i> ALL CARDS</h2>
            <div id="allCardsGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
        </div>
    </div>

    <script>
        const allCards = [
            { id: "0-0-100", name: "The Meaning of You (Human)", number: "4/100", rarity: "rare", image: "https://raw.githubusercontent.com/YOURUSERNAME/tree-top-miyagi-tcg/main/cards/0.0.100.jpg" },
            { id: "0-1-100", name: "The Meaning of You (Spiritual)", number: "4/100", rarity: "rare", image: "https://raw.githubusercontent.com/YOURUSERNAME/tree-top-miyagi-tcg/main/cards/0.1.100.jpg" },
            { id: "0-2-100", name: "The Meaning of Hope (Human)", number: "2/100", rarity: "rare", image: "https://raw.githubusercontent.com/YOURUSERNAME/tree-top-miyagi-tcg/main/cards/0.2.100.jpg" },
            { id: "0-3-100", name: "The Meaning of Ascension (Human)", number: "3/100", rarity: "rare", image: "https://raw.githubusercontent.com/YOURUSERNAME/tree-top-miyagi-tcg/main/cards/0.3.100.jpg" },
            { id: "0-4-100", name: "The Meaning of You (Festival)", number: "4/100", rarity: "rare", image: "https://raw.githubusercontent.com/YOURUSERNAME/tree-top-miyagi-tcg/main/cards/0.4.100.jpg" },
            { id: "1-100", name: "The Meaning of Life is Beautiful", number: "22/100", rarity: "rare", image: "https://raw.githubusercontent.com/YOURUSERNAME/tree-top-miyagi-tcg/main/cards/1.100.jpg" },
            { id: "2-100", name: "The Meaning of Hope", number: "2/100", rarity: "rare", image: "https://raw.githubusercontent.com/YOURUSERNAME/tree-top-miyagi-tcg/main/cards/2.100.jpg" },
            { id: "3-100", name: "The Meaning of Ascension", number: "3/100", rarity: "rare", image: "https://raw.githubusercontent.com/YOURUSERNAME/tree-top-miyagi-tcg/main/cards/3.100.jpg" },
            { id: "4-100", name: "The Meaning of You", number: "4/100", rarity: "rare", image: "https://raw.githubusercontent.com/YOURUSERNAME/tree-top-miyagi-tcg/main/cards/4.100.jpg" },
            { id: "5-100", name: "The Meaning of Atlanta", number: "5/100", rarity: "rare", image: "https://raw.githubusercontent.com/YOURUSERNAME/tree-top-miyagi-tcg/main/cards/5.jpg" },
            { id: "5-skate", name: "Skate Zone - Morrow, GA", number: "5/100", rarity: "common", image: "https://raw.githubusercontent.com/YOURUSERNAME/tree-top-miyagi-tcg/main/cards/5.jpg" },
            { id: "6-plaza", name: "The Plaza Theatre", number: "6/100", rarity: "common", image: "https://raw.githubusercontent.com/YOURUSERNAME/tree-top-miyagi-tcg/main/cards/6.jpg" },
            { id: "7-varsity", name: "The Varsity - Atlanta", number: "7/100", rarity: "common", image: "https://raw.githubusercontent.com/YOURUSERNAME/tree-top-miyagi-tcg/main/cards/7.jpg" },
            { id: "8-varsity", name: "The Varsity - Atlanta", number: "8/100", rarity: "common", image: "https://raw.githubusercontent.com/YOURUSERNAME/tree-top-miyagi-tcg/main/cards/8.jpg" },
            { id: "9-eastern", name: "The Eastern - Atlanta", number: "9/100", rarity: "common", image: "https://raw.githubusercontent.com/YOURUSERNAME/tree-top-miyagi-tcg/main/cards/9.jpg" },
            { id: "god-rare", name: "The Ultimate Trip", number: "Special / Ultra Rare - DMT Edition", rarity: "ultra", image: "https://raw.githubusercontent.com/YOURUSERNAME/tree-top-miyagi-tcg/main/cards/God Rare.jpg" },
            { id: "adhd-frenzy", name: "ADHD Frenzy", number: "Special", rarity: "ultra", image: "https://raw.githubusercontent.com/YOURUSERNAME/tree-top-miyagi-tcg/main/cards/back.jpg" },
            { id: "7-alt", name: "The Plaza Theatre (Alt)", number: "6/100", rarity: "common", image: "https://raw.githubusercontent.com/YOURUSERNAME/tree-top-miyagi-tcg/main/cards/7 Alt.jpg" },
            { id: "god-rare-alt", name: "God Rare (Alt)", number: "Special", rarity: "ultra", image: "https://raw.githubusercontent.com/YOURUSERNAME/tree-top-miyagi-tcg/main/cards/God Rare_alt.jpg" }
        ];

        let collection = JSON.parse(localStorage.getItem('miyagiCollection')) || [];
        let lastPackTime = parseInt(localStorage.getItem('lastPackTime')) || 0;
        let isOnCooldown = false;

        function navigate(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(`page-${page}`).classList.remove('hidden');
            if (page === 1) renderCollection();
            if (page === 3) renderAllCards();
        }

        function updateTimer() {
            const now = Date.now();
            const timeSince = now - lastPackTime;
            const tenMin = 10 * 60 * 1000;
            
            if (timeSince >= tenMin) {
                document.getElementById('timerDisplay').innerHTML = `<i class="fa-solid fa-clock text-green-400"></i><span class="text-green-400">READY!</span>`;
                return true;
            } else {
                const remaining = tenMin - timeSince;
                const min = Math.floor(remaining / 60000);
                const sec = Math.floor((remaining % 60000) / 1000);
                document.getElementById('timeLeft').textContent = `${min}:${sec < 10 ? '0' : ''}${sec}`;
                return false;
            }
        }

        function openPack() {
            if (isOnCooldown || !updateTimer()) {
                alert("⏳ The DMT Express is still charging… Wait 10 minutes!");
                return;
            }

            isOnCooldown = true;
            const packArea = document.getElementById('packArea');
            const openedArea = document.getElementById('openedPack');
            
            packArea.classList.add('hidden');
            openedArea.classList.remove('hidden');
            openedArea.innerHTML = '<div class="col-span-5 text-center py-8 text-3xl">UNPACKING FROM THE DMT TUNNEL...</div>';

            setTimeout(() => {
                const shuffled = [...allCards].sort(() => 0.5 - Math.random());
                const packCards = shuffled.slice(0, 5);
                
                openedArea.innerHTML = '';
                
                packCards.forEach(card => {
                    const div = document.createElement('div');
                    div.className = `card bg-black/80 border-4 border-yellow-400 rounded-3xl overflow-hidden text-center`;
                    div.innerHTML = `
                        <img src="${card.image}" class="w-full aspect-[5/7] object-cover">
                        <div class="p-4">
                            <div class="text-xl font-bold">${card.name}</div>
                            <div class="text-yellow-300 text-sm">${card.number}</div>
                        </div>
                    `;
                    openedArea.appendChild(div);
                    
                    if (!collection.includes(card.id)) collection.push(card.id);
                });
                
                localStorage.setItem('miyagiCollection', JSON.stringify(collection));
                lastPackTime = Date.now();
                localStorage.setItem('lastPackTime', lastPackTime);
                
                isOnCooldown = false;
                updateTimer();
                
                setTimeout(() => {
                    alert(`🎉 Pack opened! Check your collection.`);
                    packArea.classList.remove('hidden');
                    openedArea.classList.add('hidden');
                }, 1200);
            }, 1800);
        }

        function claimDailyPack() {
            openPack();
        }

        function renderCollection() {
            const grid = document.getElementById('collectionGrid');
            grid.innerHTML = collection.length ? '' : `<div class="col-span-full text-center py-16 text-4xl text-yellow-300">No cards yet… open packs!</div>`;
            
            collection.forEach(id => {
                const card = allCards.find(c => c.id === id);
                if (!card) return;
                const div = document.createElement('div');
                div.className = `card bg-black/80 border-4 border-yellow-400 rounded-3xl overflow-hidden`;
                div.innerHTML = `
                    <img src="${card.image}" class="w-full aspect-[5/7] object-cover">
                    <div class="p-4 text-center">
                        <div class="text-2xl">${card.name}</div>
                        <div class="text-yellow-300">${card.number}</div>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        function renderAllCards() {
            const grid = document.getElementById('allCardsGrid');
            grid.innerHTML = '';
            allCards.forEach(card => {
                const div = document.createElement('div');
                div.className = `card bg-black/80 border-4 border-yellow-400 rounded-3xl overflow-hidden cursor-pointer`;
                div.innerHTML = `
                    <img src="${card.image}" class="w-full aspect-[5/7] object-cover">
                    <div class="p-4 text-center">
                        <div class="text-2xl">${card.name}</div>
                        <div class="text-yellow-300">${card.number}</div>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        function init() {
            updateTimer();
            setInterval(updateTimer, 1000);
            navigate(0);
        }

        window.onload = init;
    </script>
</body>
</html>
