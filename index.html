<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree_Top_Miyagi TCG • Series 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1133 100%); color: white; font-family: 'VT323', monospace; }
        .card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden; }
        .card:hover { transform: scale(1.08) rotate(1deg); box-shadow: 0 0 40px rgba(255, 235, 59, 0.7); }
        
        /* RARITY */
        .god-rare { border-color: #ffd700 !important; box-shadow: 0 0 40px #ffd700; }
        .special { border-color: #c026d3 !important; box-shadow: 0 0 30px #c026d3; }
        
        /* CLASSIC RAINBOW HOLO */
        .card.holo::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.8) 50%, transparent 70%);
            animation: holoShimmer 3.5s linear infinite; pointer-events: none; opacity: 0.75;
        }
        @keyframes holoShimmer { 0% { transform: translateX(-100%) translateY(-100%); } 100% { transform: translateX(100%) translateY(100%); } }

        /* STAR HOLO FOR LOCATIONS */
        .card.star-holo::before {
            content: ''; position: absolute; inset: 0; 
            background: radial-gradient(circle, rgba(255,255,255,0.4) 1px, transparent 2px);
            background-size: 35px 35px;
            animation: starTwinkle 5s linear infinite;
            opacity: 0.5;
            pointer-events: none;
        }
        @keyframes starTwinkle { 0% { background-position: 0 0; } 100% { background-position: 180px 180px; } }

        /* FLIP */
        .reveal-card { animation: flyIn 0.8s ease-out forwards; perspective: 1000px; }
        .reveal-card img { transition: transform 0.7s; transform-style: preserve-3d; }
        .reveal-card.flipped img { transform: rotateY(360deg); }
        @keyframes flyIn { from { opacity: 0; transform: translateY(100px) rotate(-15deg) scale(0.6); } to { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); } }

        /* LANDSCAPE */
        .landscape { aspect-ratio: 7/5 !important; }

        /* HEADER BOXES */
        .header-box { transition: all 0.2s; }
        .header-box:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(234, 179, 8, 0.3); }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- PREMIUM HEADER -->
    <header class="bg-black border-b-4 border-yellow-400 py-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-yellow-400 rounded-2xl flex items-center justify-center text-4xl shadow-inner">🐝</div>
                <div>
                    <h1 class="text-4xl font-bold tracking-widest text-yellow-300">TREE_TOP_MIYAGI</h1>
                    <p class="text-xs text-yellow-400 tracking-[4px]">SERIES 1 • 100 CARDS</p>
                </div>
            </div>
            <nav class="flex gap-8 text-xl text-white">
                <a onclick="navigate(0)" class="cursor-pointer hover:text-yellow-400">HOME</a>
                <a onclick="navigate(1)" class="cursor-pointer hover:text-yellow-400">COLLECTION</a>
                <a onclick="navigate(2)" class="cursor-pointer hover:text-yellow-400">OPEN PACK</a>
                <a onclick="navigate(3)" class="cursor-pointer hover:text-yellow-400">ALL CARDS</a>
            </nav>
            <div class="flex items-center gap-3">
                <div id="readyBox" onclick="if(!isOnCooldown) openPack()" class="header-box cursor-pointer bg-green-500 text-black font-bold px-6 py-2 rounded-3xl flex items-center gap-2 border-2 border-green-400">
                    <i class="fa-solid fa-clock"></i> <span id="readyText" class="text-xl">READY!</span>
                </div>
                <button onclick="resetTimer()" class="header-box bg-red-500 hover:bg-red-600 text-white font-bold px-5 py-2 rounded-3xl flex items-center gap-2 border-2 border-red-400 text-sm">
                    <i class="fa-solid fa-rotate-right"></i> RESET TIMER
                </button>
                <div id="collectionCountBox" class="header-box bg-transparent border-2 border-yellow-400 text-yellow-300 font-bold px-5 py-2 rounded-3xl text-xl flex items-center">
                    <span id="collectionCount">0/18</span>
                </div>
                <button onclick="showRedeemModal()" class="header-box bg-transparent border-2 border-purple-400 hover:border-purple-300 text-purple-300 font-bold px-5 py-2 rounded-3xl text-sm flex items-center gap-2">
                    <i class="fa-solid fa-ticket"></i> REDEEM
                </button>
                <button onclick="claimDailyPack()" class="header-box bg-yellow-400 hover:bg-yellow-300 text-black font-bold px-8 py-3 rounded-3xl text-xl flex items-center gap-3">
                    <i class="fa-solid fa-bee"></i> OPEN PACK
                </button>
            </div>
        </div>
    </header>

    <div id="pageContainer" class="max-w-6xl mx-auto px-6 pt-8">
        <!-- HOME -->
        <div id="page-0" class="page">
            <div class="text-center py-20">
                <h1 class="text-8xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-pink-300 to-cyan-300">THE ULTIMATE TRIP</h1>
                <p class="text-4xl text-yellow-200 mt-4">Series 1 • 100 Cards</p>
                <button onclick="navigate(2)" class="mt-12 bg-gradient-to-r from-yellow-400 to-pink-500 text-black text-3xl px-12 py-6 rounded-3xl font-bold">START YOUR JOURNEY</button>
            </div>
        </div>

        <!-- COLLECTION -->
        <div id="page-1" class="page hidden">
            <h2 class="text-5xl mb-8">YOUR COLLECTION <span id="progress" class="text-yellow-300"></span></h2>
            <div id="collectionGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
        </div>

        <!-- PACK OPENER -->
        <div id="page-2" class="page hidden">
            <div class="text-center py-12">
                <h2 class="text-6xl mb-4">OPEN A PACK</h2>
                <p class="text-3xl text-yellow-300 mb-12">5 cards • Every 10 minutes</p>
                <div id="packArea" onclick="if(!isOnCooldown) openPack()" 
                     class="cursor-pointer mx-auto w-96 h-96 border-8 border-yellow-400 bg-gradient-to-br from-purple-600 to-pink-600 rounded-3xl flex items-center justify-center text-9xl shadow-2xl relative overflow-hidden">
                    <div class="text-center z-10"><i class="fa-solid fa-gift text-white text-8xl mb-6"></i><div class="text-4xl font-bold">CLICK TO OPEN</div></div>
                </div>
                <div id="openedPack" class="hidden mt-12 grid grid-cols-5 gap-6"></div>
            </div>
        </div>

        <!-- ALL CARDS -->
        <div id="page-3" class="page hidden">
            <h2 class="text-5xl mb-8">ALL CARDS</h2>
            <div id="allCardsGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
        </div>
    </div>

    <!-- REDEEM MODAL -->
    <div id="redeemModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
        <div class="bg-black border-8 border-purple-400 rounded-3xl max-w-md w-full p-8">
            <h2 class="text-4xl text-center mb-6">REDEEM CARD CODE</h2>
            <input id="redeemInput" type="text" placeholder="TTM-GODRARE" class="w-full bg-zinc-900 border-2 border-purple-400 text-white text-2xl p-4 rounded-2xl text-center font-bold">
            <div class="flex gap-4 mt-8">
                <button onclick="closeRedeemModal()" class="flex-1 bg-zinc-800 hover:bg-zinc-700 py-4 rounded-3xl text-xl">CANCEL</button>
                <button onclick="redeemCode()" class="flex-1 bg-purple-500 hover:bg-purple-400 py-4 rounded-3xl text-xl text-black font-bold">REDEEM</button>
            </div>
        </div>
    </div>

    <!-- CARD MODAL -->
    <div id="cardModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
        <div class="bg-black border-8 border-yellow-400 rounded-3xl max-w-4xl w-full overflow-hidden">
            <div class="relative">
                <img id="modalImage" class="w-full object-contain max-h-[80vh]" alt="Card">
                <button onclick="closeModal()" class="absolute top-4 right-4 bg-black/70 text-white w-10 h-10 rounded-full flex items-center justify-center text-2xl">✕</button>
            </div>
            <div class="p-6 text-center">
                <div id="modalName" class="text-4xl font-bold"></div>
                <div id="modalNumber" class="text-yellow-300 text-2xl mt-2"></div>
            </div>
        </div>
    </div>

    <script>
        const USERNAME = "aquateen168";
        const allCards = [
            { id: "god-rare", name: "The Ultimate Trip", number: "Special / Ultra Rare - DMT Edition", image: `https://raw.githubusercontent.com/${USERNAME}/Adhd-Frenzy/cards/God Rare.jpg`, rare: "god", code: "TTM-GODRARE" },
            { id: "0-0-100", name: "The Meaning of You (Human)", number: "4/100", image: `https://raw.githubusercontent.com/${USERNAME}/Adhd-Frenzy/cards/0.0.100.jpg`, code: "TTM-MEAN001" },
            { id: "0-1-100", name: "The Meaning of You (Spiritual)", number: "4/100", image: `https://raw.githubusercontent.com/${USERNAME}/Adhd-Frenzy/cards/0.1.100.jpg`, code: "TTM-MEAN002" },
            { id: "0-2-100", name: "The Meaning of Hope", number: "2/100", image: `https://raw.githubusercontent.com/${USERNAME}/Adhd-Frenzy/cards/0.2.100.jpg`, code: "TTM-HOPE001" },
            { id: "0-3-100", name: "The Meaning of Ascension", number: "3/100", image: `https://raw.githubusercontent.com/${USERNAME}/Adhd-Frenzy/cards/0.3.100.jpg`, code: "TTM-ASC001" },
            { id: "0-4-100", name: "The Meaning of You (Festival)", number: "4/100", image: `https://raw.githubusercontent.com/${USERNAME}/Adhd-Frenzy/cards/0.4.100.jpg`, code: "TTM-FEST001" },
            { id: "1-100", name: "The Meaning of Life is Beautiful", number: "22/100", image: `https://raw.githubusercontent.com/${USERNAME}/Adhd-Frenzy/cards/1.100.jpg`, code: "TTM-LIFE001" },
            { id: "5-skate", name: "Skate Zone - Morrow, GA", number: "5/100", image: `https://raw.githubusercontent.com/${USERNAME}/Adhd-Frenzy/cards/5.jpg`, landscape: true, code: "TTM-SKATE001" },
            { id: "6-plaza", name: "The Plaza Theatre", number: "6/100", image: `https://raw.githubusercontent.com/${USERNAME}/Adhd-Frenzy/cards/6.jpg`, landscape: true, code: "TTM-PLAZA001" },
            { id: "7-varsity", name: "The Varsity - Atlanta", number: "7/100", image: `https://raw.githubusercontent.com/${USERNAME}/Adhd-Frenzy/cards/7.jpg`, landscape: true, code: "TTM-VAR001" },
            { id: "8-varsity", name: "The Varsity - Atlanta", number: "8/100", image: `https://raw.githubusercontent.com/${USERNAME}/Adhd-Frenzy/cards/8.jpg`, landscape: true, code: "TTM-VAR002" },
            { id: "9-eastern", name: "The Eastern - Atlanta", number: "9/100", image: `https://raw.githubusercontent.com/${USERNAME}/Adhd-Frenzy/cards/9.jpg`, landscape: true, code: "TTM-EAST001" },
            { id: "7-alt", name: "The Plaza Theatre (Alt)", number: "6/100", image: `https://raw.githubusercontent.com/${USERNAME}/Adhd-Frenzy/cards/7 Alt.jpg`, landscape: true, code: "TTM-PLAZA002" },
            { id: "adhd-frenzy", name: "ADHD Frenzy", number: "Special", image: `https://raw.githubusercontent.com/${USERNAME}/Adhd-Frenzy/cards/back.jpg`, rare: "special", code: "TTM-ADHD001" }
        ];

        let collection = JSON.parse(localStorage.getItem('miyagiCollection')) || [];
        let lastPackTime = parseInt(localStorage.getItem('lastPackTime')) || 0;
        let isOnCooldown = false;
        let draggedCard = null;

        function resetTimer() {
            lastPackTime = 0;
            localStorage.setItem('lastPackTime', '0');
            updateTimer();
            alert("Timer reset!");
        }

        function navigate(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(`page-${page}`).classList.remove('hidden');
            if (page === 1) renderCollection();
            if (page === 3) renderAllCards();
        }

        function updateTimer() {
            const now = Date.now();
            const remaining = 600000 - (now - lastPackTime);
            if (remaining <= 0) {
                document.getElementById('readyText').textContent = "READY!";
                return true;
            }
            const min = Math.floor(remaining / 60000);
            const sec = Math.floor((remaining % 60000) / 1000);
            document.getElementById('readyText').textContent = `${min}:${sec < 10 ? '0' : ''}${sec}`;
            return false;
        }

        function updateCollectionCount() {
            document.getElementById('collectionCount').textContent = `${collection.length}/${allCards.length}`;
        }

        function showRedeemModal() {
            document.getElementById('redeemModal').classList.remove('hidden');
        }

        function closeRedeemModal() {
            document.getElementById('redeemModal').classList.add('hidden');
        }

        function redeemCode() {
            const input = document.getElementById('redeemInput').value.trim().toUpperCase();
            const card = allCards.find(c => c.code === input);
            if (card) {
                if (!collection.includes(card.id)) {
                    collection.push(card.id);
                    localStorage.setItem('miyagiCollection', JSON.stringify(collection));
                    updateCollectionCount();
                    alert(`✅ Unlocked: ${card.name}`);
                    showCardModal(card);
                } else alert("Already owned!");
            } else alert("Invalid code!");
            closeRedeemModal();
            document.getElementById('redeemInput').value = '';
        }

        function makeDraggable(div, isPack = false) {
            div.draggable = true;
            div.dataset.id = div.dataset.id || '';
            div.addEventListener('dragstart', () => { draggedCard = div; div.style.opacity = '0.5'; });
            div.addEventListener('dragend', () => { draggedCard = null; div.style.opacity = '1'; });
            div.addEventListener('dragover', e => e.preventDefault());
            div.addEventListener('drop', e => {
                e.preventDefault();
                if (draggedCard && draggedCard !== div) {
                    const parent = div.parentNode;
                    const from = Array.from(parent.children).indexOf(draggedCard);
                    const to = Array.from(parent.children).indexOf(div);
                    parent.insertBefore(draggedCard, to > from ? div.nextSibling : div);
                    if (!isPack) {
                        collection = Array.from(parent.children).map(el => el.dataset.id);
                        localStorage.setItem('miyagiCollection', JSON.stringify(collection));
                    }
                }
            });
        }

        function openPack() {
            if (isOnCooldown || !updateTimer()) {
                alert("Wait 10 minutes for next pack!");
                return;
            }
            isOnCooldown = true;
            const packArea = document.getElementById('packArea');
            const openedArea = document.getElementById('openedPack');
            packArea.classList.add('pack-burst');

            setTimeout(() => {
                packArea.classList.add('hidden');
                openedArea.classList.remove('hidden');
                openedArea.innerHTML = '<div class="col-span-5 text-center py-12 text-4xl">UNPACKING...</div>';

                setTimeout(() => {
                    const shuffled = [...allCards].sort(() => 0.5 - Math.random());
                    const packCards = shuffled.slice(0, 5);
                    openedArea.innerHTML = '';

                    packCards.forEach((card, i) => {
                        const div = document.createElement('div');
                        const rarity = card.rare === "god" ? 'god-rare god-holo' : (card.rare === "special" ? 'special special-holo' : '');
                        const holoType = card.landscape ? 'star-holo' : 'holo';
                        const aspect = card.landscape ? 'landscape' : 'aspect-[5/7]';
                        div.className = `card bg-black/80 border-4 border-yellow-400 rounded-3xl overflow-hidden cursor-pointer reveal-card ${rarity} ${holoType}`;
                        div.style.animationDelay = `${i * 150}ms`;
                        div.dataset.id = card.id;
                        div.innerHTML = `
                            <img src="${card.image}" class="w-full ${aspect} object-cover" onerror="this.src='https://placehold.co/400x560/4f46e5/fff?text=Missing'">
                            <div class="p-4 text-center">
                                <div class="text-xl">${card.name}</div>
                                <div class="text-yellow-300">${card.number}</div>
                                <div class="text-xs text-purple-300 mt-1">CODE: ${card.code}</div>
                            </div>
                        `;
                        div.onclick = () => showCardModal(card);
                        makeDraggable(div, true);
                        openedArea.appendChild(div);

                        setTimeout(() => div.classList.add('flipped'), 300 + i * 200);

                        if (!collection.includes(card.id)) collection.push(card.id);
                    });

                    localStorage.setItem('miyagiCollection', JSON.stringify(collection));
                    lastPackTime = Date.now();
                    localStorage.setItem('lastPackTime', lastPackTime);
                    isOnCooldown = false;
                    updateTimer();
                    updateCollectionCount();
                }, 800);
            }, 400);
        }

        function claimDailyPack() { openPack(); }

        function showCardModal(card) {
            const modalImg = document.getElementById('modalImage');
            modalImg.src = card.image;
            if (card.landscape) {
                modalImg.style.aspectRatio = '7/5';
                modalImg.style.maxHeight = '70vh';
            } else {
                modalImg.style.aspectRatio = '5/7';
                modalImg.style.maxHeight = '80vh';
            }
            document.getElementById('modalName').textContent = card.name;
            document.getElementById('modalNumber').textContent = card.number;
            document.getElementById('cardModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('cardModal').classList.add('hidden');
        }

        function renderCollection() {
            const grid = document.getElementById('collectionGrid');
            grid.innerHTML = collection.length ? '' : `<div class="col-span-full text-center py-20 text-4xl text-yellow-300">No cards yet… open packs!</div>`;
            collection.forEach(id => {
                const card = allCards.find(c => c.id === id);
                if (!card) return;
                const rarity = card.rare === "god" ? 'god-rare god-holo' : (card.rare === "special" ? 'special special-holo' : '');
                const holoType = card.landscape ? 'star-holo' : 'holo';
                const aspect = card.landscape ? 'landscape' : 'aspect-[5/7]';
                const div = document.createElement('div');
                div.className = `card bg-black/80 border-4 border-yellow-400 rounded-3xl overflow-hidden cursor-pointer ${rarity} ${holoType}`;
                div.dataset.id = card.id;
                div.innerHTML = `
                    <img src="${card.image}" class="w-full ${aspect} object-cover" onerror="this.src='https://placehold.co/400x560/4f46e5/fff?text=Missing'">
                    <div class="p-4 text-center">
                        <div class="text-xl">${card.name}</div>
                        <div class="text-yellow-300">${card.number}</div>
                        <div class="text-xs text-purple-300 mt-1">CODE: ${card.code}</div>
                    </div>
                `;
                div.onclick = () => showCardModal(card);
                makeDraggable(div, false);
                grid.appendChild(div);
            });
            updateCollectionCount();
        }

        function renderAllCards() {
            const grid = document.getElementById('allCardsGrid');
            grid.innerHTML = '';
            allCards.forEach(card => {
                const rarity = card.rare === "god" ? 'god-rare god-holo' : (card.rare === "special" ? 'special special-holo' : '');
                const holoType = card.landscape ? 'star-holo' : 'holo';
                const aspect = card.landscape ? 'landscape' : 'aspect-[5/7]';
                const div = document.createElement('div');
                div.className = `card bg-black/80 border-4 border-yellow-400 rounded-3xl overflow-hidden cursor-pointer ${rarity} ${holoType}`;
                div.innerHTML = `
                    <img src="${card.image}" class="w-full ${aspect} object-cover" onerror="this.src='https://placehold.co/400x560/4f46e5/fff?text=Missing'">
                    <div class="p-4 text-center">
                        <div class="text-xl">${card.name}</div>
                        <div class="text-yellow-300">${card.number}</div>
                        <div class="text-xs text-purple-300 mt-1">CODE: ${card.code}</div>
                    </div>
                `;
                div.onclick = () => showCardModal(card);
                grid.appendChild(div);
            });
        }

        function init() {
            updateTimer();
            updateCollectionCount();
            setInterval(updateTimer, 1000);
            navigate(0);
        }

        window.onload = init;
    </script>
</body>
</html>
