<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree_Top_Miyagi TCG • Series 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        body { 
            background: radial-gradient(circle at 30% 20%, rgba(255, 215, 0, 0.12) 0%, transparent 60%),
                        radial-gradient(circle at 70% 80%, rgba(192, 38, 211, 0.12) 0%, transparent 60%),
                        #0a0a1f;
            color: white; 
            font-family: 'VT323', monospace; 
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 2px),
                        url('https://picsum.photos/id/1015/1920/1080') center/cover no-repeat;
            background-blend-mode: overlay;
            animation: galaxySwirl 35s linear infinite;
            opacity: 0.65;
            z-index: -1;
            pointer-events: none;
        }
        @keyframes galaxySwirl { 0% { background-position: 0 0; } 100% { background-position: 600px 600px; } }

        .card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden; }
        .card:hover { transform: scale(1.08) rotate(1deg); box-shadow: 0 0 40px rgba(255, 235, 59, 0.7); }
        .god-rare { border-color: #ffd700 !important; box-shadow: 0 0 40px #ffd700; }
        .special { border-color: #c026d3 !important; box-shadow: 0 0 30px #c026d3; }
        .card.holo::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.8) 50%, transparent 70%);
            animation: holoShimmer 3.5s linear infinite; pointer-events: none; opacity: 0.75;
        }
        @keyframes holoShimmer { 0% { transform: translateX(-100%) translateY(-100%); } 100% { transform: translateX(100%) translateY(100%); } }
        .card.star-holo::before {
            content: ''; position: absolute; inset: 0; 
            background: radial-gradient(circle, rgba(255,255,255,0.4) 1px, transparent 2px);
            background-size: 35px 35px;
            animation: starTwinkle 5s linear infinite;
            opacity: 0.5;
        }
        @keyframes starTwinkle { 0% { background-position: 0 0; } 100% { background-position: 180px 180px; } }
        .landscape-modal { aspect-ratio: 7/5 !important; max-height: 70vh; }
    </style>
</head>
<body class="min-h-screen pb-12">

<header class="bg-black/90 border-b-4 border-yellow-400 py-4 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-6 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-yellow-400 rounded-2xl flex items-center justify-center text-4xl shadow-inner">🐝</div>
            <div>
                <h1 class="text-4xl font-bold tracking-widest text-yellow-300">TREE_TOP_MIYAGI</h1>
                <p class="text-xs text-yellow-400 tracking-[4px]">SERIES 1 • 100 CARDS</p>
            </div>
        </div>
        <nav class="flex gap-6 text-xl text-white">
            <a onclick="navigate(0)" class="nav-btn cursor-pointer">HOME</a>
            <a onclick="navigate(1)" class="nav-btn cursor-pointer">COLLECTION</a>
            <a onclick="navigate(2)" class="nav-btn cursor-pointer">OPEN PACK</a>
            <a onclick="navigate(3)" class="nav-btn cursor-pointer">ALL CARDS</a>
            <a onclick="navigate(4)" class="nav-btn cursor-pointer">QUESTS</a>
            <a onclick="navigate(5)" class="nav-btn cursor-pointer">TRADE</a>
        </nav>
        <div class="flex items-center gap-3">
            <div id="readyBox" onclick="if(!isOnCooldown) openPack()" class="header-box cursor-pointer bg-green-500 text-black font-bold px-6 py-2 rounded-3xl flex items-center gap-2 border-2 border-green-400">
                <i class="fa-solid fa-clock"></i> <span id="readyText" class="text-xl">READY!</span>
            </div>
            <div id="collectionCountBox" class="header-box bg-transparent border-2 border-yellow-400 text-yellow-300 font-bold px-5 py-2 rounded-3xl text-xl flex items-center">
                <span id="collectionCount">0/14</span>
            </div>
            <button onclick="showRedeemModal()" class="header-box bg-transparent border-2 border-purple-400 hover:border-purple-300 text-purple-300 font-bold px-5 py-2 rounded-3xl text-sm flex items-center gap-2">
                <i class="fa-solid fa-ticket"></i> REDEEM
            </button>
            <button onclick="claimDailyPack()" class="header-box bg-yellow-400 hover:bg-yellow-300 text-black font-bold px-8 py-3 rounded-3xl text-xl flex items-center gap-3">
                <i class="fa-solid fa-bee"></i> OPEN PACK
            </button>
        </div>
    </div>
</header>

<div id="pageContainer" class="max-w-6xl mx-auto px-6 pt-8">
    <!-- HOME, COLLECTION, PACK, ALL CARDS pages (your original content) -->
    <div id="page-0" class="page"> <!-- your home content --> </div>
    <div id="page-1" class="page hidden"> <h2 class="text-5xl mb-8">YOUR COLLECTION</h2> <div id="collectionGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6"></div> </div>
    <div id="page-2" class="page hidden"> <!-- your pack opener --> </div>
    <div id="page-3" class="page hidden"> <h2 class="text-5xl mb-8">ALL CARDS</h2> <div id="allCardsGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6"></div> </div>

    <!-- DAILY QUESTS -->
    <div id="page-4" class="page hidden">
        <h2 class="text-5xl mb-8">DAILY QUESTS <span id="questStreak" class="text-yellow-300"></span></h2>
        <div id="questsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </div>

    <!-- TRADE – Revised with Mini Collection -->
    <div id="page-5" class="page hidden">
        <h2 class="text-5xl mb-8">TRADE WITH THE HIVE</h2>
        <div class="flex gap-4 mb-6">
            <button onclick="startTrade()" class="bg-yellow-400 hover:bg-yellow-300 text-black font-bold px-8 py-3 rounded-3xl">Create Trade Session</button>
            <button onclick="joinTrade()" class="bg-purple-500 hover:bg-purple-400 text-white font-bold px-8 py-3 rounded-3xl">Join Trade Session</button>
        </div>

        <!-- Mini Collection for easy clicking (no cross-tab drag) -->
        <div class="mb-8">
            <h3 class="text-2xl mb-3">Your Collection – Click to Offer</h3>
            <div id="miniCollection" class="grid grid-cols-4 md:grid-cols-6 gap-3 max-h-48 overflow-y-auto p-2 border border-yellow-400 rounded-2xl"></div>
        </div>

        <div class="grid grid-cols-2 gap-8">
            <div>
                <h3 class="text-3xl mb-4">Your Offer</h3>
                <div id="tradeOffer" class="min-h-[200px] border-4 border-dashed border-yellow-400 rounded-3xl p-6"></div>
            </div>
            <div>
                <h3 class="text-3xl mb-4">Their Offer</h3>
                <div id="tradeReceive" class="min-h-[200px] border-4 border-dashed border-purple-400 rounded-3xl p-6"></div>
            </div>
        </div>
        <div class="text-center mt-8">
            <button onclick="confirmTrade()" class="bg-gradient-to-r from-yellow-400 to-pink-500 text-black text-3xl px-16 py-6 rounded-3xl font-bold">COMPLETE TRADE 🐝</button>
        </div>
    </div>
</div>

<!-- CARD MODAL (your original) -->
<div id="cardModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
    <div class="bg-black border-8 border-yellow-400 rounded-3xl max-w-4xl w-full overflow-hidden">
        <div class="relative">
            <img id="modalImage" class="w-full object-contain landscape-modal" alt="Card">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-black/70 text-white w-10 h-10 rounded-full flex items-center justify-center text-2xl">✕</button>
        </div>
        <div class="p-6 text-center">
            <div id="modalName" class="text-4xl font-bold"></div>
            <div id="modalNumber" class="text-yellow-300 text-2xl mt-2"></div>
        </div>
    </div>
</div>

<script>
    // === YOUR FULL ORIGINAL CARD DATA & FUNCTIONS ===
    const USERNAME = "aquateen168";
    const allCards = [ /* paste your exact 14-card array here from the working file */ 
        { id: "god-rare", name: "The Ultimate Trip", number: "Special / Ultra Rare - DMT Edition", image: `https://raw.githubusercontent.com/${USERNAME}/Adhd-Frenzy/cards/God Rare.jpg`, rare: "god", code: "TTM-GODRARE" },
        // ... add the rest of your cards exactly as in your working file ...
    ];

    let collection = JSON.parse(localStorage.getItem('miyagiCollection')) || [];
    let lastPackTime = parseInt(localStorage.getItem('lastPackTime')) || 0;
    let isOnCooldown = false;

    let myOffer = [];
    let theirOffer = [];

    function navigate(page) {
        document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
        document.getElementById(`page-${page}`).classList.remove('hidden');
        if (page === 1) renderCollection();
        if (page === 3) renderAllCards();
        if (page === 4) generateDailyQuests();
        if (page === 5) renderTrade();
    }

    // Keep all your original functions: updateTimer, openPack, renderCollection, renderAllCards, showCardModal, etc.

    // Revised Trade with Mini Collection (click to offer)
    function renderTrade() {
        renderMiniCollection();
        renderMyOffer();
        renderTheirOffer();
    }

    function renderMiniCollection() {
        const container = document.getElementById('miniCollection');
        container.innerHTML = '';
        collection.forEach(id => {
            const card = allCards.find(c => c.id === id);
            if (!card) return;
            const div = document.createElement('div');
            div.className = `cursor-pointer border border-yellow-400 rounded-xl overflow-hidden`;
            div.innerHTML = `
                <img src="${card.image}" class="w-full h-20 object-cover" onerror="this.src='https://placehold.co/100x140/4f46e5/fff?text=?'">
                <div class="text-[10px] p-1 text-center truncate">${card.name}</div>
            `;
            div.onclick = () => {
                if (!myOffer.includes(id)) {
                    myOffer.push(id);
                    renderMyOffer();
                }
            };
            container.appendChild(div);
        });
    }

    function renderMyOffer() {
        const area = document.getElementById('tradeOffer');
        area.innerHTML = myOffer.map(id => {
            const card = allCards.find(c => c.id === id);
            return `<div onclick="removeFromOffer('${id}')" class="inline-block bg-black/70 p-2 m-1 rounded cursor-pointer">${card ? card.name : id}</div>`;
        }).join('') || '<p class="text-yellow-300">Click cards above to add to offer</p>';
    }

    function removeFromOffer(id) {
        myOffer = myOffer.filter(item => item !== id);
        renderMyOffer();
    }

    function renderTheirOffer() {
        const area = document.getElementById('tradeReceive');
        area.innerHTML = theirOffer.length ? theirOffer.map(id => {
            const card = allCards.find(c => c.id === id);
            return `<div class="inline-block bg-purple-700 p-2 m-1 rounded">${card ? card.name : id}</div>`;
        }).join('') : '<p class="text-yellow-300">Waiting for partner...</p>';
    }

    function startTrade() {
        navigate(5);
        myOffer = [];
        theirOffer = [];
        alert("Trade session started! Open another window/tab, go to TRADE, and click 'Join Trade Session' to connect.");
    }

    function joinTrade() {
        navigate(5);
        myOffer = [];
        theirOffer = [];
        alert("Joined trade session! Click cards in the mini collection above to build your offer.");
    }

    function confirmTrade() {
        if (myOffer.length === 0) {
            alert("Add at least one card to your offer!");
            return;
        }
        alert(`🐝 Trade confirmed!\nYou offered ${myOffer.length} cards.\nCards swapped in your collection.`);
        // Apply swap (demo)
        collection = collection.filter(id => !myOffer.includes(id));
        collection = collection.concat(myOffer); // loopback for testing
        localStorage.setItem('miyagiCollection', JSON.stringify(collection));
        renderCollection();
        myOffer = [];
        renderMyOffer();
    }

    // Keep your other functions (openPack, renderCollection, etc.) and init()

    function init() {
        updateTimer();
        updateCollectionCount();
        setInterval(updateTimer, 1000);
        navigate(0);
    }

    window.onload = init;
</script>
</body>
</html>
