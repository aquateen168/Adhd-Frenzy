<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree_Top_Miyagi TCG • Series 1</title>
    <script src="[cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <link rel="stylesheet" href="[cdnjs.cloudflare.com](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css)">
    <style>
        @import url('[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=VT323&display=swap)');
        
        * { box-sizing: border-box; }
        
        body { 
            background: radial-gradient(circle at 30% 20%, rgba(255, 215, 0, 0.12) 0%, transparent 60%),
                        radial-gradient(circle at 70% 80%, rgba(192, 38, 211, 0.12) 0%, transparent 60%),
                        #0a0a1f;
            color: white; 
            font-family: 'VT323', monospace; 
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 2px);
            background-size: 50px 50px;
            animation: galaxySwirl 35s linear infinite;
            opacity: 0.65;
            z-index: -1;
            pointer-events: none;
        }
        
        @keyframes galaxySwirl { 
            0% { background-position: 0 0; } 
            100% { background-position: 600px 600px; } 
        }

        .card { 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            position: relative; 
            overflow: hidden; 
        }
        .card:hover { 
            transform: scale(1.05) rotate(0.5deg); 
            box-shadow: 0 0 40px rgba(255, 235, 59, 0.7); 
        }
        
        .god-rare { 
            border-color: #ffd700 !important; 
            box-shadow: 0 0 40px #ffd700, 0 0 80px rgba(255, 215, 0, 0.5); 
        }
        .special { 
            border-color: #c026d3 !important; 
            box-shadow: 0 0 30px #c026d3; 
        }
        
        .card.holo::after { 
            content: ''; 
            position: absolute; 
            top: -50%; 
            left: -50%; 
            width: 200%; 
            height: 200%;
            background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.6) 50%, transparent 70%);
            animation: holoShimmer 3s linear infinite; 
            pointer-events: none;
        }
        @keyframes holoShimmer { 
            0% { transform: translateX(-100%) translateY(-100%); } 
            100% { transform: translateX(100%) translateY(100%); } 
        }
        
        .card-thumb { 
            overflow: hidden; 
            background: #1a1a2e;
        }
        .card-thumb img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: transform 0.3s;
        }
        .card:hover .card-thumb img {
            transform: scale(1.05);
        }
        
        .landscape-modal { 
            aspect-ratio: 7/5 !important; 
            max-height: 70vh; 
        }
        
        .nav-btn {
            position: relative;
            padding: 0.5rem 0;
            transition: color 0.2s;
        }
        .nav-btn:hover {
            color: #fbbf24;
        }
        .nav-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: #fbbf24;
            transition: width 0.2s;
        }
        .nav-btn:hover::after {
            width: 100%;
        }
        
        .pack-box {
            transition: all 0.3s;
        }
        .pack-box:hover:not(.on-cooldown) {
            transform: scale(1.02);
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.5);
        }
        .pack-box.on-cooldown {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .reveal-card {
            animation: cardReveal 0.6s ease-out;
        }
        @keyframes cardReveal {
            0% { transform: scale(0.8) rotateY(90deg); opacity: 0; }
            50% { transform: scale(1.1) rotateY(0deg); }
            100% { transform: scale(1) rotateY(0deg); opacity: 1; }
        }
        
        .quest-item {
            transition: all 0.3s;
        }
        .quest-item:hover {
            transform: translateX(4px);
        }
        .quest-complete {
            border-color: #22c55e !important;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
        }
        
        .ready-pulse {
            animation: readyPulse 2s ease-in-out infinite;
        }
        @keyframes readyPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            50% { box-shadow: 0 0 20px 10px rgba(34, 197, 94, 0); }
        }
    </style>
</head>
<body class="pb-12">

<header class="bg-black/90 border-b-4 border-yellow-400 py-4 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-6 flex items-center justify-between flex-wrap gap-4">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-yellow-400 rounded-2xl flex items-center justify-center text-3xl shadow-inner">🐝</div>
            <div>
                <h1 class="text-3xl md:text-4xl font-bold tracking-widest text-yellow-300">TREE_TOP_MIYAGI</h1>
                <p class="text-xs text-yellow-400 tracking-[4px]">SERIES 1 • 14 CARDS</p>
            </div>
        </div>
        
        <nav class="hidden md:flex gap-6 text-xl text-white">
            <button onclick="navigate(0)" class="nav-btn">HOME</button>
            <button onclick="navigate(1)" class="nav-btn">COLLECTION</button>
            <button onclick="navigate(2)" class="nav-btn">OPEN PACK</button>
            <button onclick="navigate(3)" class="nav-btn">ALL CARDS</button>
            <button onclick="navigate(4)" class="nav-btn">QUESTS</button>
        </nav>
        
        <div class="flex items-center gap-3">
            <div id="readyBox" class="bg-green-500 text-black font-bold px-4 py-2 rounded-2xl flex items-center gap-2 text-lg">
                <i class="fa-solid fa-clock"></i>
                <span id="readyText">READY!</span>
            </div>
            <div class="bg-transparent border-2 border-yellow-400 text-yellow-300 font-bold px-4 py-2 rounded-2xl text-lg">
                <span id="collectionCount">0/14</span>
            </div>
            <button onclick="openPack()" id="openPackBtn" class="bg-yellow-400 hover:bg-yellow-300 text-black font-bold px-6 py-3 rounded-2xl text-xl flex items-center gap-2 transition-colors">
                <i class="fa-solid fa-gift"></i> OPEN
            </button>
        </div>
    </div>
</header>

<main id="pageContainer" class="max-w-6xl mx-auto px-6 pt-8">
    
    <!-- HOME -->
    <section id="page-0" class="page">
        <div class="text-center py-16">
            <h1 class="text-5xl md:text-7xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-pink-300 to-cyan-300 leading-tight">
                THE ULTIMATE TRIP
            </h1>
            <p class="text-3xl text-yellow-200 mt-4">Series 1 • 14 Cards</p>
            <button onclick="navigate(2)" class="mt-10 bg-gradient-to-r from-yellow-400 to-pink-500 hover:from-yellow-300 hover:to-pink-400 text-black text-2xl px-10 py-5 rounded-2xl font-bold transition-all hover:scale-105">
                START YOUR JOURNEY
            </button>
            
            <div class="mt-16">
                <h3 class="text-4xl text-yellow-300 mb-6">JOIN THE HIVE</h3>
                <div class="flex flex-col sm:flex-row gap-4 max-w-lg mx-auto">
                    <a href="[whatnot.com](https://www.whatnot.com/user/mysticcardarena)" target="_blank" rel="noopener" 
                       class="flex-1 bg-purple-600 hover:bg-purple-500 text-white px-6 py-4 rounded-2xl text-xl flex items-center justify-center gap-3 border-2 border-purple-400 transition-colors">
                        <i class="fa-solid fa-shopping-bag"></i> WHATNOT
                    </a>
                    <a href="[tiktok.com](https://www.tiktok.com/@tree_top_miyagi)" target="_blank" rel="noopener"
                       class="flex-1 bg-black hover:bg-zinc-900 text-white px-6 py-4 rounded-2xl text-xl flex items-center justify-center gap-3 border-2 border-pink-400 transition-colors">
                        <i class="fa-brands fa-tiktok"></i> TIKTOK
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- COLLECTION -->
    <section id="page-1" class="page hidden">
        <h2 class="text-4xl mb-6">YOUR COLLECTION</h2>
        <div id="collectionGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-5"></div>
    </section>

    <!-- PACK OPENER -->
    <section id="page-2" class="page hidden">
        <div class="text-center py-10">
            <h2 class="text-5xl mb-2">OPEN A PACK</h2>
            <p class="text-2xl text-yellow-300 mb-10">1 card every 10 minutes</p>
            
            <div id="packArea" class="pack-box cursor-pointer mx-auto w-72 h-80 md:w-80 md:h-96 border-8 border-yellow-400 bg-gradient-to-br from-purple-600 to-pink-600 rounded-3xl flex items-center justify-center shadow-2xl">
                <div class="text-center">
                    <i class="fa-solid fa-gift text-white text-7xl mb-4"></i>
                    <div class="text-3xl font-bold">CLICK TO OPEN</div>
                </div>
            </div>
            
            <div id="openedPack" class="hidden mt-10 flex flex-col items-center"></div>
            
            <button id="openAnotherBtn" onclick="resetPackArea()" class="hidden mt-8 bg-yellow-400 hover:bg-yellow-300 text-black font-bold px-8 py-3 rounded-2xl text-xl transition-colors">
                OPEN ANOTHER
            </button>
        </div>
    </section>

    <!-- ALL CARDS -->
    <section id="page-3" class="page hidden">
        <h2 class="text-4xl mb-6">ALL CARDS</h2>
        <div id="allCardsGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-5"></div>
    </section>

    <!-- QUESTS -->
    <section id="page-4" class="page hidden">
        <div class="flex items-center gap-4 mb-6">
            <h2 class="text-4xl">DAILY QUESTS</h2>
            <span id="questStreak" class="text-yellow-300 text-2xl"></span>
        </div>
        <div id="questsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>
    
</main>

<!-- CARD MODAL -->
<div id="cardModal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center z-50 p-4" onclick="closeModal(event)">
    <div class="bg-black border-4 border-yellow-400 rounded-2xl max-w-2xl w-full overflow-hidden" onclick="event.stopPropagation()">
        <div class="relative">
            <img id="modalImage" class="w-full object-contain max-h-[60vh]" alt="Card">
            <button onclick="closeModal()" class="absolute top-3 right-3 bg-black/80 hover:bg-black text-white w-10 h-10 rounded-full flex items-center justify-center text-xl transition-colors">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="p-5 text-center">
            <div id="modalName" class="text-3xl font-bold"></div>
            <div id="modalNumber" class="text-yellow-300 text-xl mt-1"></div>
            <div id="modalOwned" class="text-green-400 text-lg mt-2"></div>
        </div>
    </div>
</div>

<script>
const GITHUB_USER = "aquateen168";
const GITHUB_REPO = "Adhd-Frenzy";
const COOLDOWN_MS = 600000; // 10 minutes

const allCards = [
    { id: "god-rare", name: "The Ultimate Trip", number: "Ultra Rare", rarity: "god", landscape: false },
    { id: "0-0-100", name: "The Meaning of You (Human)", number: "4/100", rarity: "common", landscape: false },
    { id: "0-1-100", name: "The Meaning of You (Spiritual)", number: "4/100", rarity: "common", landscape: false },
    { id: "0-2-100", name: "The Meaning of Hope", number: "2/100", rarity: "common", landscape: false },
    { id: "0-3-100", name: "The Meaning of Ascension", number: "3/100", rarity: "common", landscape: false },
    { id: "0-4-100", name: "The Meaning of You (Festival)", number: "4/100", rarity: "common", landscape: false },
    { id: "1-100", name: "The Meaning of Life is Beautiful", number: "22/100", rarity: "common", landscape: false },
    { id: "5-skate", name: "Skate Zone - Morrow, GA", number: "5/100", rarity: "common", landscape: true },
    { id: "6-plaza", name: "The Plaza Theatre", number: "6/100", rarity: "common", landscape: true },
    { id: "7-varsity", name: "The Varsity - Atlanta", number: "7/100", rarity: "common", landscape: true },
    { id: "8-varsity", name: "The Varsity - Atlanta", number: "8/100", rarity: "common", landscape: true },
    { id: "9-eastern", name: "The Eastern - Atlanta", number: "9/100", rarity: "common", landscape: true },
    { id: "7-alt", name: "The Plaza Theatre (Alt)", number: "6/100", rarity: "common", landscape: true },
    { id: "adhd-frenzy", name: "ADHD Frenzy", number: "Special", rarity: "special", landscape: false }
];

// Map IDs to image filenames
const imageMap = {
    "god-rare": "God Rare.jpg",
    "0-0-100": "0.0.100.jpg",
    "0-1-100": "0.1.100.jpg",
    "0-2-100": "0.2.100.jpg",
    "0-3-100": "0.3.100.jpg",
    "0-4-100": "0.4.100.jpg",
    "1-100": "1.100.jpg",
    "5-skate": "5.jpg",
    "6-plaza": "6.jpg",
    "7-varsity": "7.jpg",
    "8-varsity": "8.jpg",
    "9-eastern": "9.jpg",
    "7-alt": "7 Alt.jpg",
    "adhd-frenzy": "back.jpg"
};

function getImageUrl(cardId) {
    const filename = imageMap[cardId] || `${cardId}.jpg`;
    return `[raw.githubusercontent.com](https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/cards/${encodeURIComponent(filename)})`;
}

// State
let collection = [];
let lastPackTime = 0;
let packsOpenedToday = 0;
let questsCompletedToday = [];

function loadState() {
    try {
        collection = JSON.parse(localStorage.getItem('miyagiCollection')) || [];
        lastPackTime = parseInt(localStorage.getItem('lastPackTime')) || 0;
        packsOpenedToday = parseInt(localStorage.getItem('packsToday')) || 0;
        questsCompletedToday = JSON.parse(localStorage.getItem('questsCompleted')) || [];
        
        // Reset daily counters if new day
        const lastDay = localStorage.getItem('lastDay');
        const today = new Date().toDateString();
        if (lastDay !== today) {
            packsOpenedToday = 0;
            questsCompletedToday = [];
            localStorage.setItem('lastDay', today);
            localStorage.setItem('packsToday', '0');
            localStorage.setItem('questsCompleted', '[]');
        }
    } catch (e) {
        console.error('Failed to load state:', e);
    }
}

function saveState() {
    localStorage.setItem('miyagiCollection', JSON.stringify(collection));
    localStorage.setItem('lastPackTime', lastPackTime.toString());
    localStorage.setItem('packsToday', packsOpenedToday.toString());
    localStorage.setItem('questsCompleted', JSON.stringify(questsCompletedToday));
}

function isOnCooldown() {
    return Date.now() - lastPackTime < COOLDOWN_MS;
}

function getRemainingTime() {
    const remaining = COOLDOWN_MS - (Date.now() - lastPackTime);
    return Math.max(0, remaining);
}

function formatTime(ms) {
    const min = Math.floor(ms / 60000);
    const sec = Math.floor((ms % 60000) / 1000);
    return `${min}:${sec.toString().padStart(2, '0')}`;
}

function updateTimerDisplay() {
    const readyBox = document.getElementById('readyBox');
    const readyText = document.getElementById('readyText');
    const packArea = document.getElementById('packArea');
    const openPackBtn = document.getElementById('openPackBtn');
    
    if (isOnCooldown()) {
        const remaining = getRemainingTime();
        readyText.textContent = formatTime(remaining);
        readyBox.className = 'bg-zinc-700 text-white font-bold px-4 py-2 rounded-2xl flex items-center gap-2 text-lg';
        packArea?.classList.add('on-cooldown');
        openPackBtn?.setAttribute('disabled', 'true');
        openPackBtn?.classList.add('opacity-50', 'cursor-not-allowed');
    } else {
        readyText.textContent = 'READY!';
        readyBox.className = 'bg-green-500 text-black font-bold px-4 py-2 rounded-2xl flex items-center gap-2 text-lg ready-pulse';
        packArea?.classList.remove('on-cooldown');
        openPackBtn?.removeAttribute('disabled');
        openPackBtn?.classList.remove('opacity-50', 'cursor-not-allowed');
    }
}

function updateCollectionCount() {
    const unique = new Set(collection).size;
    document.getElementById('collectionCount').textContent = `${unique}/${allCards.length}`;
}

function navigate(pageIndex) {
    document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
    const page = document.getElementById(`page-${pageIndex}`);
    if (page) {
        page.classList.remove('hidden');
        
        if (pageIndex === 1) renderCollection();
        if (pageIndex === 3) renderAllCards();
        if (pageIndex === 4) renderQuests();
    }
}

function openPack() {
    if (isOnCooldown()) {
        const remaining = getRemainingTime();
        alert(`Wait ${formatTime(remaining)} for your next pack!`);
        return;
    }
    
    navigate(2);
    
    const packArea = document.getElementById('packArea');
    const openedArea = document.getElementById('openedPack');
    const openAnotherBtn = document.getElementById('openAnotherBtn');
    
    packArea.classList.add('hidden');
    openedArea.classList.remove('hidden');
    openedArea.innerHTML = '';
    
    // Weighted random selection (god rare is rarer)
    const weights = allCards.map(c => c.rarity === 'god' ? 1 : c.rarity === 'special' ? 3 : 10);
    const totalWeight = weights.reduce((a, b) => a + b, 0);
    let random = Math.random() * totalWeight;
    let selectedCard = allCards[0];
    
    for (let i = 0; i < allCards.length; i++) {
        random -= weights[i];
        if (random <= 0) {
            selectedCard = allCards[i];
            break;
        }
    }
    
    const isNew = !collection.includes(selectedCard.id);
    collection.push(selectedCard.id);
    
    const rarityClass = selectedCard.rarity === 'god' ? 'god-rare' : selectedCard.rarity === 'special' ? 'special' : '';
    const aspectClass = selectedCard.landscape ? 'aspect-[7/5]' : 'aspect-[5/7]';
    
    const cardEl = document.createElement('div');
    cardEl.className = `card bg-black/80 border-4 border-yellow-400 rounded-2xl overflow-hidden cursor-pointer reveal-card holo ${rarityClass} w-full max-w-sm`;
    cardEl.innerHTML = `
        ${isNew ? '<div class="bg-green-500 text-black text-center py-1 font-bold text-lg">✨ NEW CARD!</div>' : ''}
        <div class="card-thumb ${aspectClass}">
            <img src="${getImageUrl(selectedCard.id)}" alt="${selectedCard.name}" 
                 onerror="this.src='[placehold.co](https://placehold.co/400x560/1a1a2e/fbbf24?text=Missing)'">
        </div>
        <div class="p-4 text-center">
            <div class="text-2xl font-bold">${selectedCard.name}</div>
            <div class="text-yellow-300 text-xl">${selectedCard.number}</div>
        </div>
    `;
    cardEl.onclick = () => showCardModal(selectedCard);
    openedArea.appendChild(cardEl);
    
    openAnotherBtn.classList.remove('hidden');
    
    lastPackTime = Date.now();
    packsOpenedToday++;
    saveState();
    updateTimerDisplay();
    updateCollectionCount();
    checkQuests();
}

function resetPackArea() {
    const packArea = document.getElementById('packArea');
    const openedArea = document.getElementById('openedPack');
    const openAnotherBtn = document.getElementById('openAnotherBtn');
    
    openedArea.classList.add('hidden');
    openedArea.innerHTML = '';
    openAnotherBtn.classList.add('hidden');
    packArea.classList.remove('hidden');
}

function showCardModal(card) {
    const modal = document.getElementById('cardModal');
    const img = document.getElementById('modalImage');
    
    img.src = getImageUrl(card.id);
    img.alt = card.name;
    img.className = card.landscape ? 'w-full object-contain max-h-[60vh] landscape-modal' : 'w-full object-contain max-h-[60vh]';
    
    document.getElementById('modalName').textContent = card.name;
    document.getElementById('modalNumber').textContent = card.number;
    
    const count = collection.filter(id => id === card.id).length;
    document.getElementById('modalOwned').textContent = count > 0 ? `Owned: ${count}` : 'Not in collection';
    
    modal.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
}

function closeModal(event) {
    if (event && event.target !== event.currentTarget) return;
    document.getElementById('cardModal').classList.add('hidden');
    document.body.style.overflow = '';
}

function renderCollection() {
    const grid = document.getElementById('collectionGrid');
    const uniqueIds = [...new Set(collection)];
    
    if (uniqueIds.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center py-16 text-3xl text-yellow-300">No cards yet—open some packs!</div>';
        return;
    }
    
    grid.innerHTML = '';
    uniqueIds.forEach(id => {
        const card = allCards.find(c => c.id === id);
        if (!card) return;
        
        const count = collection.filter(cid => cid === id).length;
        const aspectClass = card.landscape ? 'aspect-[7/5]' : 'aspect-[5/7]';
        const rarityClass = card.rarity === 'god' ? 'god-rare' : card.rarity === 'special' ? 'special' : '';
        
        const div = document.createElement('div');
        div.className = `card bg-black/80 border-4 border-yellow-400 rounded-2xl overflow-hidden cursor-pointer holo ${rarityClass}`;
        div.innerHTML = `
            <div class="card-thumb ${aspectClass}">
                <img src="${getImageUrl(card.id)}" alt="${card.name}"
                     onerror="this.src='[placehold.co](https://placehold.co/400x560/1a1a2e/fbbf24?text=Missing)'">
            </div>
            <div class="p-3 text-center">
                <div class="text-lg truncate">${card.name}</div>
                <div class="text-yellow-300 text-sm">${card.number}</div>
                ${count > 1 ? `<div class="text-green-400 text-sm">×${count}</div>` : ''}
            </div>
        `;
        div.onclick = () => showCardModal(card);
        grid.appendChild(div);
    });
}

function renderAllCards() {
    const grid = document.getElementById('allCardsGrid');
    grid.innerHTML = '';
    
    allCards.forEach(card => {
        const owned = collection.includes(card.id);
        const aspectClass = card.landscape ? 'aspect-[7/5]' : 'aspect-[5/7]';
        const rarityClass = card.rarity === 'god' ? 'god-rare' : card.rarity === 'special' ? 'special' : '';
        
        const div = document.createElement('div');
        div.className = `card bg-black/80 border-4 border-yellow-400 rounded-2xl overflow-hidden cursor-pointer ${owned ? 'holo' : 'opacity-60 grayscale'} ${rarityClass}`;
        div.innerHTML = `
            <div class="card-thumb ${aspectClass}">
                <img src="${getImageUrl(card.id)}" alt="${card.name}"
                     onerror="this.src='[placehold.co](https://placehold.co/400x560/1a1a2e/fbbf24?text=Missing)'">
            </div>
            <div class="p-3 text-center">
                <div class="text-lg truncate">${card.name}</div>
                <div class="text-yellow-300 text-sm">${card.number}</div>
                <div class="text-sm ${owned ? 'text-green-400' : 'text-zinc-500'}">${owned ? '✓ Owned' : 'Not owned'}</div>
            </div>
        `;
        div.onclick = () => showCardModal(card);
        grid.appendChild(div);
    });
}

const dailyQuests = [
    { id: 'open3', text: 'Open 3 packs today', check: () => packsOpenedToday >= 3, reward: 'Extra pack tomorrow' },
    { id: 'view', text: 'View your collection', check: () => questsCompletedToday.includes('view'), reward: 'Satisfaction' },
    { id: 'collect5', text: 'Own 5 unique cards', check: () => new Set(collection).size >= 5, reward: 'Bragging rights' }
];

function renderQuests() {
    const grid = document.getElementById('questsGrid');
    const streak = parseInt(localStorage.getItem('questStreak')) || 0;
    
    document.getElementById('questStreak').textContent = streak > 0 ? `${streak} day streak 🔥` : '';
    
    grid.innerHTML = '';
    dailyQuests.forEach(quest => {
        const complete = quest.check();
        const div = document.createElement('div');
        div.className = `quest-item bg-black/80 border-4 ${complete ? 'border-green-500 quest-complete' : 'border-yellow-400'} rounded-2xl p-5 flex items-center justify-between`;
        div.innerHTML = `
            <div>
                <div class="text-2xl ${complete ? 'line-through text-zinc-500' : ''}">${quest.text}</div>
                <div class="text-yellow-300 text-lg">Reward: ${quest.reward}</div>
            </div>
            <div class="text-4xl">${complete ? '✅' : '⬜'}</div>
        `;
        
        if (quest.id === 'view' && !complete) {
            div.onclick = () => {
                navigate(1);
                if (!questsCompletedToday.includes('view')) {
                    questsCompletedToday.push('view');
                    saveState();
                }
            };
            div.classList.add('cursor-pointer');
        }
        
        grid.appendChild(div);
    });
}

function checkQuests() {
    // Auto-check quest completion after actions
    renderQuests();
}

// Keyboard support
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
});

// Init
function init() {
    loadState();
    updateTimerDisplay();
    updateCollectionCount();
    
    // Update timer every second
    setInterval(updateTimerDisplay, 1000);
    
    // Pack area click handler
    document.getElementById('packArea').onclick = openPack;
    
    navigate(0);
}

window.onload = init;
</script>
</body>
</html>
