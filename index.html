<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree_Top_Miyagi TCG • Series 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        body { 
            background: radial-gradient(circle at 30% 20%, rgba(255, 215, 0, 0.12) 0%, transparent 60%),
                        radial-gradient(circle at 70% 80%, rgba(192, 38, 211, 0.12) 0%, transparent 60%),
                        #0a0a1f;
            color: white; 
            font-family: 'VT323', monospace; 
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 2px),
                        url('https://picsum.photos/id/1015/1920/1080') center/cover no-repeat;
            background-blend-mode: overlay;
            animation: galaxySwirl 35s linear infinite;
            opacity: 0.65;
            z-index: -1;
            pointer-events: none;
        }
        @keyframes galaxySwirl { 0% { background-position: 0 0; } 100% { background-position: 600px 600px; } }

        .card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden; }
        .card:hover { transform: scale(1.08) rotate(1deg); box-shadow: 0 0 40px rgba(255, 235, 59, 0.7); }
        .god-rare { border-color: #ffd700 !important; box-shadow: 0 0 40px #ffd700; }
        .special { border-color: #c026d3 !important; box-shadow: 0 0 30px #c026d3; }
        .card.holo::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.8) 50%, transparent 70%);
            animation: holoShimmer 3.5s linear infinite; pointer-events: none; opacity: 0.75;
        }
        @keyframes holoShimmer { 0% { transform: translateX(-100%) translateY(-100%); } 100% { transform: translateX(100%) translateY(100%); } }
        .card.star-holo::before {
            content: ''; position: absolute; inset: 0; 
            background: radial-gradient(circle, rgba(255,255,255,0.4) 1px, transparent 2px);
            background-size: 35px 35px;
            animation: starTwinkle 5s linear infinite;
            opacity: 0.5;
        }
        @keyframes starTwinkle { 0% { background-position: 0 0; } 100% { background-position: 180px 180px; } }
        .landscape-modal { aspect-ratio: 7/5 !important; max-height: 70vh; }
        .quest-complete { animation: questPop 0.6s ease-out; box-shadow: 0 0 30px #22c55e; }
        @keyframes questPop { 0% { transform: scale(0.8); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="min-h-screen pb-12">

<!-- HEADER (added Quests & Trade tabs) -->
<header class="bg-black/90 border-b-4 border-yellow-400 py-4 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-6 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-yellow-400 rounded-2xl flex items-center justify-center text-4xl shadow-inner">🐝</div>
            <div>
                <h1 class="text-4xl font-bold tracking-widest text-yellow-300">TREE_TOP_MIYAGI</h1>
                <p class="text-xs text-yellow-400 tracking-[4px]">SERIES 1 • 100 CARDS</p>
            </div>
        </div>
        <nav class="flex gap-6 text-xl text-white">
            <a onclick="navigate(0)" class="nav-btn cursor-pointer">HOME</a>
            <a onclick="navigate(1)" class="nav-btn cursor-pointer">COLLECTION</a>
            <a onclick="navigate(2)" class="nav-btn cursor-pointer">OPEN PACK</a>
            <a onclick="navigate(3)" class="nav-btn cursor-pointer">ALL CARDS</a>
            <a onclick="navigate(4)" class="nav-btn cursor-pointer">QUESTS</a>
            <a onclick="navigate(5)" class="nav-btn cursor-pointer">TRADE</a>
        </nav>
        <div class="flex items-center gap-3">
            <div id="readyBox" onclick="if(!isOnCooldown) openPack()" class="header-box cursor-pointer bg-green-500 text-black font-bold px-6 py-2 rounded-3xl flex items-center gap-2 border-2 border-green-400">
                <i class="fa-solid fa-clock"></i> <span id="readyText" class="text-xl">READY!</span>
            </div>
            <div id="collectionCountBox" class="header-box bg-transparent border-2 border-yellow-400 text-yellow-300 font-bold px-5 py-2 rounded-3xl text-xl flex items-center">
                <span id="collectionCount">0/14</span>
            </div>
            <button onclick="showRedeemModal()" class="header-box bg-transparent border-2 border-purple-400 hover:border-purple-300 text-purple-300 font-bold px-5 py-2 rounded-3xl text-sm flex items-center gap-2">
                <i class="fa-solid fa-ticket"></i> REDEEM
            </button>
            <button onclick="claimDailyPack()" class="header-box bg-yellow-400 hover:bg-yellow-300 text-black font-bold px-8 py-3 rounded-3xl text-xl flex items-center gap-3">
                <i class="fa-solid fa-bee"></i> OPEN PACK
            </button>
        </div>
    </div>
</header>

<div id="pageContainer" class="max-w-6xl mx-auto px-6 pt-8">
    <!-- Your original pages 0-3 (HOME, COLLECTION, PACK, ALL CARDS) stay exactly the same -->
    <div id="page-0" class="page"> ... (your original home content) ... </div>
    <div id="page-1" class="page hidden"> ... (your original collection) ... </div>
    <div id="page-2" class="page hidden"> ... (your original pack opener) ... </div>
    <div id="page-3" class="page hidden"> ... (your original all cards) ... </div>

    <!-- NEW: DAILY QUESTS -->
    <div id="page-4" class="page hidden">
        <h2 class="text-5xl mb-8">DAILY QUESTS <span id="questStreak" class="text-yellow-300"></span></h2>
        <div id="questsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
