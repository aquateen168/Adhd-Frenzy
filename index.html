<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree_Top_Miyagi TCG • Series 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        body {
            background: radial-gradient(circle at 30% 20%, rgba(255, 215, 0, 0.12) 0%, transparent 60%),
                        radial-gradient(circle at 70% 80%, rgba(192, 38, 211, 0.12) 0%, transparent 60%),
                        #0a0a1f;
            color: white;
            font-family: 'VT323', monospace;
            position: relative;
            overflow-x: hidden;
        }
       
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 2px),
                        url('https://picsum.photos/id/1015/1920/1080') center/cover no-repeat;
            background-blend-mode: overlay;
            animation: galaxySwirl 35s linear infinite;
            opacity: 0.65;
            z-index: -1;
            pointer-events: none;
        }
       
        @keyframes galaxySwirl {
            0% { background-position: 0 0; }
            100% { background-position: 600px 600px; }
        }
        
        .card { 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            position: relative; 
            overflow: hidden; 
        }
        .card:hover { 
            transform: scale(1.08) rotate(1deg); 
            box-shadow: 0 0 40px rgba(255, 235, 59, 0.7); 
        }
       
        /* MODAL IMPROVEMENTS */
        .modal-bg {
            transition: opacity 0.3s ease;
        }
        .modal-content {
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen pb-12">
    <!-- HEADER (unchanged) -->
    <header class="bg-black/90 border-b-4 border-yellow-400 py-4 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-6xl mx-auto px-6 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-yellow-400 rounded-2xl flex items-center justify-center text-4xl shadow-inner">🐝</div>
                <div>
                    <h1 class="text-4xl font-bold tracking-widest text-yellow-300">TREE_TOP_MIYAGI</h1>
                    <p class="text-xs text-yellow-400 tracking-[4px]">SERIES 1 • 100 CARDS</p>
                </div>
            </div>
            <nav class="flex gap-6 text-xl text-white">
                <a onclick="navigate(0)" class="nav-btn cursor-pointer">HOME</a>
                <a onclick="navigate(1)" class="nav-btn cursor-pointer">COLLECTION</a>
                <a onclick="navigate(2)" class="nav-btn cursor-pointer">OPEN PACK</a>
                <a onclick="navigate(3)" class="nav-btn cursor-pointer">ALL CARDS</a>
            </nav>
            <div class="flex items-center gap-3">
                <div id="readyBox" onclick="if(!isOnCooldown) openPack()" class="header-box cursor-pointer bg-green-500 text-black font-bold px-6 py-2 rounded-3xl flex items-center gap-2 border-2 border-green-400">
                    <i class="fa-solid fa-clock"></i> <span id="readyText" class="text-xl">READY!</span>
                </div>
                <div id="collectionCountBox" class="header-box bg-transparent border-2 border-yellow-400 text-yellow-300 font-bold px-5 py-2 rounded-3xl text-xl flex items-center">
                    <span id="collectionCount">0/18</span>
                </div>
                <button onclick="showRedeemModal()" class="header-box bg-transparent border-2 border-purple-400 hover:border-purple-300 text-purple-300 font-bold px-5 py-2 rounded-3xl text-sm flex items-center gap-2">
                    <i class="fa-solid fa-ticket"></i> REDEEM
                </button>
                <button onclick="claimDailyPack()" class="header-box bg-yellow-400 hover:bg-yellow-300 text-black font-bold px-8 py-3 rounded-3xl text-xl flex items-center gap-3">
                    <i class="fa-solid fa-bee"></i> OPEN PACK
                </button>
            </div>
        </div>
    </header>

    <div id="pageContainer" class="max-w-6xl mx-auto px-6 pt-8">
        <!-- Pages remain the same as your code -->
        <!-- HOME, COLLECTION, PACK OPENER, ALL CARDS -->
        <!-- (I kept them exactly as you had them) -->
        <div id="page-0" class="page"> ... </div>
        <div id="page-1" class="page hidden"> ... </div>
        <div id="page-2" class="page hidden"> ... </div>
        <div id="page-3" class="page hidden"> ... </div>
    </div>

    <!-- CARD MODAL - FIXED -->
    <div id="cardModal" onclick="if(event.target === this) closeModal()" 
         class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50 modal-bg">
        <div onclick="event.stopImmediatePropagation()" 
             class="modal-content bg-black border-8 border-yellow-400 rounded-3xl max-w-4xl w-full overflow-hidden relative">
            
            <!-- EXIT BUTTON - Top Right -->
            <button onclick="closeModal()" 
                    class="absolute top-4 right-4 bg-black/80 hover:bg-red-600 text-white w-12 h-12 rounded-full flex items-center justify-center text-3xl font-bold z-10 border-2 border-yellow-400">
                ✕
            </button>

            <div class="relative">
                <img id="modalImage" class="w-full object-contain" alt="Card">
            </div>
            <div class="p-6 text-center">
                <div id="modalName" class="text-4xl font-bold"></div>
                <div id="modalNumber" class="text-yellow-300 text-2xl mt-2"></div>
            </div>
        </div>
    </div>

    <!-- Rest of your modals and script stay the same, only the modal part is updated -->

    <script>
        // ... your existing script ...

        function showCardModal(card) {
            const modalImg = document.getElementById('modalImage');
            modalImg.src = card.image;
            
            // Optional: make landscape cards wider
            if (card.landscape) {
                modalImg.style.maxHeight = '75vh';
            } else {
                modalImg.style.maxHeight = '85vh';
            }
            
            document.getElementById('modalName').textContent = card.name;
            document.getElementById('modalNumber').textContent = card.number;
            document.getElementById('cardModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('cardModal').classList.add('hidden');
        }

        // Rest of your functions (navigate, openPack, renderCollection, etc.) remain unchanged
        // Just make sure the modal closing works with the new onclick on the background

        function init() {
            updateTimer();
            updateCollectionCount();
            setInterval(updateTimer, 1000);
            navigate(0);
        }
        window.onload = init;
    </script>
</body>
</html>
