        function updateTimer() {

            const now = Date.now();
            const remaining = 600000 - (now - lastPackTime);

            if (remaining <= 0) {
                timerEl.innerHTML = `<i class="fa-solid fa-clock text-green-400"></i><span class="text-green-400">READY!</span>`;
                return true;
            } else {
                const min = Math.floor(remaining / 60000);
                const sec = Math.floor((remaining % 60000) / 1000);
                timeEl.textContent = `${min}:${sec < 10 ? '0' : ''}${sec}`;
                return false;
            }
        }
