<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree_Top_Miyagi TCG • Series 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        /* Your original styles + new additions */
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        body { 
            background: radial-gradient(circle at 30% 20%, rgba(255, 215, 0, 0.12) 0%, transparent 60%),
                        radial-gradient(circle at 70% 80%, rgba(192, 38, 211, 0.12) 0%, transparent 60%),
                        #0a0a1f;
            color: white; 
            font-family: 'VT323', monospace; 
            position: relative;
            overflow-x: hidden;
        }
        /* ... (keep all your original card, holo, galaxySwirl, etc. styles) ... */

        /* NEW: Quest glow */
        .quest-complete { animation: questPop 0.6s ease-out; box-shadow: 0 0 30px #22c55e; }
        @keyframes questPop { 0% { transform: scale(0.8); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- HEADER (updated with Quests tab) -->
    <header class="bg-black/90 border-b-4 border-yellow-400 py-4 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-6xl mx-auto px-6 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-yellow-400 rounded-2xl flex items-center justify-center text-4xl shadow-inner">🐝</div>
                <div>
                    <h1 class="text-4xl font-bold tracking-widest text-yellow-300">TREE_TOP_MIYAGI</h1>
                    <p class="text-xs text-yellow-400 tracking-[4px]">SERIES 1 • 100 CARDS</p>
                </div>
            </div>
            <nav class="flex gap-6 text-xl text-white">
                <a onclick="navigate(0)" class="nav-btn cursor-pointer">HOME</a>
                <a onclick="navigate(1)" class="nav-btn cursor-pointer">COLLECTION</a>
                <a onclick="navigate(2)" class="nav-btn cursor-pointer">OPEN PACK</a>
                <a onclick="navigate(3)" class="nav-btn cursor-pointer">ALL CARDS</a>
                <a onclick="navigate(4)" class="nav-btn cursor-pointer">QUESTS</a>
                <a onclick="navigate(5)" class="nav-btn cursor-pointer">TRADE</a>
            </nav>
            <!-- existing header buttons... -->
            <div class="flex items-center gap-3">
                <!-- ... keep your readyBox, collectionCountBox, REDEEM, OPEN PACK ... -->
            </div>
        </div>
    </header>

    <div id="pageContainer" class="max-w-6xl mx-auto px-6 pt-8">

        <!-- Existing pages 0-3 stay the same -->

        <!-- NEW PAGE 4: DAILY QUESTS -->
        <div id="page-4" class="page hidden">
            <h2 class="text-5xl mb-8">DAILY QUESTS <span id="questStreak" class="text-yellow-300"></span></h2>
            <div id="questsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
            <div class="mt-8 text-center">
                <button onclick="claimDailyReward()" class="bg-green-500 hover:bg-green-400 text-black font-bold px-10 py-4 rounded-3xl text-2xl">CLAIM DAILY HIVE REWARD</button>
            </div>
        </div>

        <!-- NEW PAGE 5: TRADING SYSTEM -->
        <div id="page-5" class="page hidden">
            <h2 class="text-5xl mb-8">TRADE WITH THE HIVE</h2>
            <div class="grid grid-cols-2 gap-8">
                <div>
                    <h3 class="text-3xl mb-4">Your Offer</h3>
                    <div id="tradeOffer" class="min-h-[300px] border-4 border-dashed border-yellow-400 rounded-3xl p-6"></div>
                </div>
                <div>
                    <h3 class="text-3xl mb-4">Their Offer (Simulated)</h3>
                    <div id="tradeReceive" class="min-h-[300px] border-4 border-dashed border-purple-400 rounded-3xl p-6"></div>
                </div>
            </div>
            <div class="text-center mt-8">
                <button onclick="confirmTrade()" class="bg-gradient-to-r from-yellow-400 to-pink-500 text-black text-3xl px-16 py-6 rounded-3xl font-bold">COMPLETE TRADE 🐝</button>
            </div>
            <p class="text-center text-xs text-yellow-300 mt-4">Trading is simulated locally — real P2P coming soon via WebRTC</p>
        </div>

    </div>

    <!-- Existing modals... keep them -->

    <script>
        // === YOUR ORIGINAL CODE (allCards, collection, pack logic, etc.) ===
        // Paste your full original <script> content here first...

        // === NEW MECHANICS CODE ===

        // Daily Quests
        let quests = JSON.parse(localStorage.getItem('miyagiQuests')) || [];
        let lastQuestDate = localStorage.getItem('lastQuestDate') || '';
        let streak = parseInt(localStorage.getItem('questStreak')) || 0;

        function generateDailyQuests() {
            const today = new Date().toDateString();
            if (lastQuestDate !== today) {
                quests = [
                    { id: 1, desc: "Open 3 packs today", progress: 0, goal: 3, reward: "1 bonus pack + 50 Hive Points" },
                    { id: 2, desc: "View your full collection", progress: 0, goal: 1, reward: "Special border unlock" },
                    { id: 3, desc: "Share a card on Whatnot/TikTok", progress: 0, goal: 1, reward: "ADHD Frenzy variant hint" }
                ];
                lastQuestDate = today;
                streak = (streak + 1) % 7 || 1; // 7-day streak max for fun
                localStorage.setItem('miyagiQuests', JSON.stringify(quests));
                localStorage.setItem('lastQuestDate', today);
                localStorage.setItem('questStreak', streak);
            }
            renderQuests();
        }

        function renderQuests() {
            const grid = document.getElementById('questsGrid');
            grid.innerHTML = '';
            quests.forEach((q, i) => {
                const div = document.createElement('div');
                div.className = `bg-black/80 border-4 border-yellow-400 rounded-3xl p-6 ${q.progress >= q.goal ? 'quest-complete' : ''}`;
                div.innerHTML = `
                    <div class="text-2xl">${q.desc}</div>
                    <div class="text-yellow-300 mt-2">${q.progress}/${q.goal}</div>
                    <div class="text-xs text-purple-300 mt-4">Reward: ${q.reward}</div>
                    <button onclick="progressQuest(${i})" class="mt-6 bg-green-500 hover:bg-green-400 text-black px-6 py-2 rounded-2xl text-lg w-full">
                        ${q.progress >= q.goal ? '✅ COMPLETE' : 'PROGRESS'}
                    </button>
                `;
                grid.appendChild(div);
            });
            document.getElementById('questStreak').textContent = `${streak} DAY STREAK 🔥`;
        }

        function progressQuest(index) {
            quests[index].progress++;
            if (quests[index].progress >= quests[index].goal) {
                // Auto-add reward logic (example: give a free card)
                alert(`Quest complete! Earned: ${quests[index].reward}`);
            }
            localStorage.setItem('miyagiQuests', JSON.stringify(quests));
            renderQuests();
        }

        function claimDailyReward() {
            alert("🐝 Daily Hive Reward claimed! +1 free pack unlocked tomorrow + 100 points");
            // Could auto-open a pack or add a special card here
        }

        // Simple Trading System (drag from collection or offer cards)
        let tradeOfferCards = [];

        function renderTrade() {
            // Populate offer area with draggable cards from collection (similar to makeDraggable)
            const offerDiv = document.getElementById('tradeOffer');
            offerDiv.innerHTML = '<p class="text-yellow-300">Drag cards from your Collection here to offer</p>';
            // For demo, pre-load a couple
        }

        function confirmTrade() {
            if (tradeOfferCards.length === 0) return alert("Offer something first!");
            alert("TRADE COMPLETE! You received: The Plaza Theatre (Alt) + 2 Hive Points 🐝");
            // In real version: remove from collection, add new cards
            tradeOfferCards = [];
            renderTrade();
        }

        // Whatnot Integration Hints (UI + info)
        function showWhatnotHint() {
            alert(`Whatnot Integration Tip:\n\nLink your listings directly from mysticcardarena.\nUse Whatnot Seller API (GraphQL) to sync inventory when physical prints sell.\nSchedule live breaks of Series 1 physical drops!\n\nPro move: Tag @tree_top_miyagi in streams for cross-promo.`);
        }

        // Print-on-Demand Button (modal or direct link)
        function openPrintModal() {
            const cardId = prompt("Enter card ID to print (e.g. god-rare):");
            const card = allCards.find(c => c.id === cardId);
            if (card) {
                alert(`Sending ${card.name} to Print-on-Demand...\n\nServices ready:\n• QPMN / Printify / The Game Crafter\n• Custom TCG decks with your bee art\n• No minimums — dropship to fans\n\n(Real integration would POST to their API with image URL)`);
            }
        }

        // Update navigate() to handle new pages
        function navigate(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(`page-${page}`).classList.remove('hidden');
            if (page === 1) renderCollection();
            if (page === 3) renderAllCards();
            if (page === 4) { generateDailyQuests(); }
            if (page === 5) { renderTrade(); }
        }

        // Add buttons in header or Home for quick access:
        // e.g. <button onclick="navigate(4)">DAILY QUESTS</button>
        // <button onclick="navigate(5)">TRADE</button>
        // <button onclick="showWhatnotHint()">CONNECT WHATNOT</button>
        // <button onclick="openPrintModal()">PRINT PHYSICAL</button>

        // Init update
        function init() {
            // your original init...
            updateTimer();
            updateCollectionCount();
            setInterval(updateTimer, 1000);
            navigate(0);
            generateDailyQuests(); // bootstrap quests
        }

        window.onload = init;
    </script>
</body>
</html>
