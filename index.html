<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        body { 
            background: radial-gradient(circle at 30% 20%, rgba(255, 215, 0, 0.12) 0%, transparent 60%),
                        radial-gradient(circle at 70% 80%, rgba(192, 38, 211, 0.12) 0%, transparent 60%),
                        #0a0a1f;
            color: white; 
            font-family: 'VT323', monospace; 
            overflow-x: hidden;
            touch-action: manipulation;
        }
        
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 2px),
                        url('https://picsum.photos/id/1015/1920/1080') center/cover no-repeat;
            background-blend-mode: overlay;
            animation: galaxySwirl 35s linear infinite;
            opacity: 0.65;
            z-index: -1;
            pointer-events: none;
        }
        
        @keyframes galaxySwirl { 0% { background-position: 0 0; } 100% { background-position: 600px 600px; } }

        .card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden; }
        .card:hover { transform: scale(1.05) rotate(1deg); box-shadow: 0 0 40px rgba(255, 235, 59, 0.7); }
        
        .god-rare { border-color: #ffd700 !important; box-shadow: 0 0 40px #ffd700; }
        .special { border-color: #c026d3 !important; box-shadow: 0 0 30px #c026d3; }
        
        .card.holo::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.8) 50%, transparent 70%);
            animation: holoShimmer 3.5s linear infinite; pointer-events: none; opacity: 0.75;
        }
        @keyframes holoShimmer { 0% { transform: translateX(-100%) translateY(-100%); } 100% { transform: translateX(100%) translateY(100%); } }

        .card.star-holo::before {
            content: ''; position: absolute; inset: 0; 
            background: radial-gradient(circle, rgba(255,255,255,0.4) 1px, transparent 2px);
            background-size: 35px 35px;
            animation: starTwinkle 5s linear infinite;
            opacity: 0.5;
            pointer-events: none;
        }
        @keyframes starTwinkle { 0% { background-position: 0 0; } 100% { background-position: 180px 180px; } }

        .card-thumb img {
            width: 100%; height: 100%; object-fit: cover; object-position: center;
        }

        .landscape-modal { aspect-ratio: 7/5 !important; max-height: 75vh; }

        .reveal-card { animation: flyIn 0.8s ease-out forwards; perspective: 1200px; }
        .reveal-card img { transition: transform 1.1s cubic-bezier(0.25, 0.1, 0.25, 1); transform-style: preserve-3d; }
        .reveal-card.flipped img { transform: rotateY(720deg) rotate(12deg); }
        .reveal-card.settled img { transform: rotateY(720deg) rotate(0deg) !important; }
        @keyframes flyIn { 
            from { opacity: 0; transform: translateY(120px) rotate(-20deg) scale(0.5); } 
            to { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); } 
        }

        .header-box { transition: all 0.2s; }
        .header-box:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(234, 179, 8, 0.3); }

        .nav-btn {
            transition: all 0.3s ease;
            padding: 8px 16px;
            border-radius: 9999px;
            background: rgba(234, 179, 8, 0.1);
        }
        .nav-btn:hover {
            background: rgba(234, 179, 8, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.6);
        }

        .card-grid {
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        }
        @media (min-width: 640px) {
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
        }

        #packArea {
            width: 100%;
            max-width: 380px;
            height: 380px;
            margin: 0 auto;
            position: relative;
            z-index: 20;
        }
        @media (min-width: 640px) {
            #packArea { max-width: 420px; height: 420px; }
        }
    </style>
</head>
